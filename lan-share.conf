# =====================================================================
# LAN Share - Personal Server Configuration
# =====================================================================
# This file is automatically loaded by:
#   - ./start.sh
#   - ./lanshare.sh (start, run, status)
#   - systemd user service (lan-share.service)
#
# Any environment variables passed to the process (e.g. PORT=9000 ./start.sh)
# will take precedence over these values.
# =====================================================================

# Server Port (default: 8080)
# Change if port 8080 is already in use by another service
PORT=8080

# Bind Address (0.0.0.0 listens on all local network interfaces)
HOST=0.0.0.0

# Storage Directory for uploaded files
# Can be relative to project root or an absolute path (e.g., ~/Documents/LAN Share/uploads)
# Note: Tilde (~) is automatically expanded to your user home directory.
STORAGE_DIR=./data/uploads

# Persistent Database and Metadata Directory (stores link bookmarks and file metadata)
DATA_DIR=./data

# Hard Application-Level Storage Quota for uploaded files (default: 2GB)
# Once total uploads reach this limit, new uploads will be rejected until files are deleted.
MAX_STORAGE_SIZE=2GB

# Maximum allowed single file upload size (default: 5120MB = 5GB)
MAX_FILE_SIZE=5120MB
MAX_REQUEST_SIZE=5120MB

# JVM Options (optimized for Linux personal server)
JAVA_OPTS="-Xms128m -Xmx1024m -XX:+UseG1GC -Djava.awt.headless=true"
