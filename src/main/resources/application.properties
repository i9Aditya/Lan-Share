# Server configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.address=${HOST:${SERVER_ADDRESS:0.0.0.0}}

# Storage configuration
lan.storage.location=${STORAGE_DIR:${LAN_STORAGE_LOCATION:./data/uploads}}
lan.storage.max-storage-size=${MAX_STORAGE_SIZE:2GB}

# Large file upload support (5GB limit, adjust as needed)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5120MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5120MB}

# Persistent embedded H2 database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${DATA_DIR:./data}/db/lanshare;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Graceful shutdown configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator endpoints for health checks and status monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# HTTP response compression for faster network transfers
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging configuration
logging.level.com.lanshare=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

