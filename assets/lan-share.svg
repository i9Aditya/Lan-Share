<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- App Icon Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <!-- Network Central Node -->
  <circle cx="64" cy="64" r="16" fill="url(#accentGrad)"/>
  <!-- Orbiting Nodes -->
  <circle cx="28" cy="42" r="10" fill="#38bdf8"/>
  <circle cx="100" cy="42" r="10" fill="#34d399"/>
  <circle cx="64" cy="100" r="10" fill="#818cf8"/>
  <!-- Connecting Links -->
  <line x1="36" y1="47" x2="52" y2="57" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="92" y1="47" x2="76" y2="57" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="64" y1="80" x2="64" y2="90" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Share Arrows on Central Node -->
  <path d="M58 64 L70 64 M66 60 L70 64 L66 68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
